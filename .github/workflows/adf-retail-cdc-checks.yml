name: adf-retail-cdc-checks

on:
  pull_request:
    paths:
      - 'adf/**/pl_ingest_retail_db.json'
      - 'adf/**/pl_cdc_*.json'
      - 'adf/datasets/ds_retail_cdc_*.json'
      - 'scripts/build_retail_cdc_adf.py'
      - 'tests/test_retail_cdc_adf.py'
      - '.github/workflows/adf-retail-cdc-checks.yml'

permissions:
  contents: read

jobs:
  retail-cdc-adf:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Kiểm định nghĩa ADF bằng SDK Azure
        run: uv run --frozen --with azure-mgmt-datafactory==9.2.0 python scripts/build_retail_cdc_adf.py --check --sdk-check
      - name: Kiểm tuyến CDC, công bố và watermark
        run: uv run --frozen pytest tests/test_retail_cdc_adf.py -q
