# SQL nguồn dùng T-SQL/CDC: kiểm hành vi bằng SQL Server Developer local, không dùng Azure.
name: retail-sql-checks

on:
  pull_request:
    paths:
      - 'src/ingest/sql/**'
      - 'src/ingest/seed_retail_db.py'
      - 'tests/sql/**'
      - 'scripts/check_retail_sql.py'
      - '.github/workflows/retail-sql-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retail-sql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  retail-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra ingest
      - name: Kiểm CDC, fallback và seed trên database tạm
        run: uv run --frozen --extra ingest python scripts/check_retail_sql.py --seed
