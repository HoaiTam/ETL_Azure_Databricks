# Đồng bộ `Input status` và `Còn chờ` trên GitHub Project #8 theo Status và phụ thuộc (docs/tasks/README.md).
# Token mặc định của Actions không ghi được vào Project của tài khoản cá nhân, nên dùng secret `PROJECT_TOKEN`:
# PAT classic chỉ cần scope `project`; repo public nên đọc issue không cần scope `repo`.
# Kéo thẻ giữa các cột trên Project không phát sự kiện cho repo, nên có thêm lịch chạy định kỳ.
name: sync-task-board

on:
  issues:
    types: [closed, reopened]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-task-board
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - name: Kiểm tra secret
        id: token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Chưa có secret PROJECT_TOKEN, bỏ qua đồng bộ board."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'

      - name: Đồng bộ board
        if: steps.token.outputs.ok == 'true'
        run: python3 scripts/sync_task_board.py --apply
