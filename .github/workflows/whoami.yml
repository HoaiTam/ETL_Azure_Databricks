# Workflow tạm để kiểm tra bootstrap (docs/devops/02, mục 6): OIDC đăng nhập được và in đúng Sub A.
# Xóa file này sau khi đã kiểm tra xong.
name: whoami

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_A }}
      - run: az account show --query "{name:name, id:id, user:user.name}" -o table
