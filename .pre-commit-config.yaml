# Cài: brew install pre-commit tflint && pre-commit install
# Chạy tay trên toàn repo: pre-commit run --all-files
# Phiên bản (rev) cập nhật bằng: pre-commit autoupdate
# `pre-commit install` cài cả hook commit-msg nhờ dòng dưới (quy ước ở CONTRIBUTING.md).
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1500]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args: [--hook-config=--retry-once-with-cleanup=true, --tf-init-args=-backend=false]
      - id: terraform_tflint
        args: [--args=--config=__GIT_WORKING_DIR__/.tflint.hcl]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks # chặn lỡ commit connection string / key

  - repo: local
    hooks:
      - id: commit-msg-lint
        name: commit message theo CONTRIBUTING.md
        entry: python3 scripts/commit_lint.py
        language: system
        stages: [commit-msg]
