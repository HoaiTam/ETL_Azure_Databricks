# Job batch medallion (docs/devops/06, mục 2.1). Lịch chạy chính thức do ADF pl_master gọi, nên không đặt schedule.
resources:
  jobs:
    batch_medallion:
      name: instacart-batch-medallion
      job_clusters:
        - job_cluster_key: sn
          new_cluster:
            policy_id: ${var.policy_id}
            apply_policy_default_values: true
            custom_tags:
              owner: p2
      tasks:
        - task_key: ingest_bronze
          job_cluster_key: sn
          spark_python_task:
            python_file: ../../src/batch/ingest_bronze.py
            parameters: ["--catalog", "${var.catalog}"]

        - task_key: build_silver
          depends_on:
            - task_key: ingest_bronze
          job_cluster_key: sn
          spark_python_task:
            python_file: ../../src/batch/build_silver.py
            parameters: ["--catalog", "${var.catalog}"]

        - task_key: build_gold
          depends_on:
            - task_key: build_silver
          job_cluster_key: sn
          spark_python_task:
            python_file: ../../src/batch/build_gold.py
            parameters: ["--catalog", "${var.catalog}"]
